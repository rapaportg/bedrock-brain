# =============================================================================
# bedrock-brain nginx — SSL termination + reverse proxy
#
# Subdomains routed:
#   app.yourdomain.com   → brain-web  :3000
#   api.yourdomain.com   → brain-api  :8000
#   auth.yourdomain.com  → keycloak   :8080
#   mcp.yourdomain.com   → mcp-gateway:8001
#
# Replace "yourdomain.com" with your actual domain before deploying.
# Certbot manages certs at /etc/letsencrypt/live/<domain>/
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ---------------------------------------------------------------------------
    # Logging
    # ---------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ---------------------------------------------------------------------------
    # Global SSL settings
    # ---------------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;

    # ---------------------------------------------------------------------------
    # HTTP → HTTPS redirect (all domains)
    # Also serves ACME challenge for Let's Encrypt
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------------------------
    # app.yourdomain.com → brain-web (React UI)
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name app.yourdomain.com;

        ssl_certificate     /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;

        location / {
            proxy_pass         http://brain-web:3000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }

    # ---------------------------------------------------------------------------
    # api.yourdomain.com → brain-api (FastAPI)
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name api.yourdomain.com;

        ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # Allow large note uploads (default is 1MB)
        client_max_body_size 50M;

        location / {
            proxy_pass         http://brain-api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            # SSE support (MCP streaming)
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 86400s;
        }
    }

    # ---------------------------------------------------------------------------
    # auth.yourdomain.com → Keycloak
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name auth.yourdomain.com;

        ssl_certificate     /etc/letsencrypt/live/auth.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/auth.yourdomain.com/privkey.pem;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # Keycloak needs larger headers for tokens
        proxy_buffer_size   128k;
        proxy_buffers       4 256k;
        proxy_busy_buffers_size 256k;

        location / {
            proxy_pass         http://keycloak:8080;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Forwarded-Port 443;
        }
    }

    # ---------------------------------------------------------------------------
    # mcp.yourdomain.com → MCP Gateway
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name mcp.yourdomain.com;

        ssl_certificate     /etc/letsencrypt/live/mcp.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mcp.yourdomain.com/privkey.pem;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        location / {
            proxy_pass         http://mcp-gateway:8001;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            # SSE / long-poll support for MCP
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 86400s;
        }
    }
}
