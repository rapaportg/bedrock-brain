name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Python lint (ruff) — brain-api, mcp-gateway, sync-bridge
  # ---------------------------------------------------------------------------
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint brain-api
        run: ruff check services/brain-api/app
        working-directory: ${{ github.workspace }}

      - name: Lint mcp-gateway
        run: ruff check services/mcp-gateway/app
        working-directory: ${{ github.workspace }}

      - name: Lint sync-bridge
        run: ruff check services/sync-bridge/app
        working-directory: ${{ github.workspace }}

  # ---------------------------------------------------------------------------
  # Job 2: Python tests — brain-api (166 tests, no live DB required)
  # ---------------------------------------------------------------------------
  test-brain-api:
    name: Test brain-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/brain-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/brain-api/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]" asyncpg

      - name: Run tests
        run: pytest tests/ -v --no-header -p no:cacheprovider --tb=short
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-secret-key
          POSTGRES_HOST: localhost
          POSTGRES_PASSWORD: test
          OIDC_ISSUER_URL: http://localhost:8080/realms/bedrock
          OIDC_JWKS_URL: http://localhost:8080/realms/bedrock/protocol/openid-connect/certs
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY_ID: test
          S3_SECRET_ACCESS_KEY: test

  # ---------------------------------------------------------------------------
  # Job 3: Web build — brain-web (React + Vite)
  # ---------------------------------------------------------------------------
  build-web:
    name: Build brain-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/brain-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/brain-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
          VITE_KEYCLOAK_URL: http://localhost:8080
          VITE_KEYCLOAK_REALM: bedrock
          VITE_KEYCLOAK_CLIENT_ID: brain-ui

  # ---------------------------------------------------------------------------
  # Job 4: Helm lint — validate all charts
  # ---------------------------------------------------------------------------
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Lint brain-api chart
        run: helm lint infra/helm/brain-api

      - name: Lint mcp-gateway chart
        run: helm lint infra/helm/mcp-gateway

      - name: Lint sync-bridge chart
        run: helm lint infra/helm/sync-bridge

      - name: Lint pgbouncer chart
        run: helm lint infra/helm/pgbouncer

      - name: Lint redis chart
        run: helm lint infra/helm/redis

      - name: Lint keycloak chart
        run: helm lint infra/helm/keycloak

  # ---------------------------------------------------------------------------
  # Job 5: Build & push to DOCR — only on pushes to main
  #
  # Pushes two tags per image:
  #   :<git-sha>  — immutable, used by deploy and for rollback
  #   :latest     — convenience alias
  #
  # Requires these GitHub secrets:
  #   DO_API_TOKEN    — DigitalOcean API token (authenticates to DOCR)
  #   DO_REGISTRY_NAME — DOCR registry slug, e.g. "bedrock"
  #
  # Requires these GitHub Actions variables (non-sensitive, baked into brain-web):
  #   VITE_API_BASE_URL       — e.g. https://api.yourdomain.com
  #   VITE_KEYCLOAK_URL       — e.g. https://auth.yourdomain.com
  #   VITE_KEYCLOAK_REALM     — bedrock
  #   VITE_KEYCLOAK_CLIENT_ID — brain-ui
  # ---------------------------------------------------------------------------
  docker-build:
    name: Build & Push to DOCR
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-python, test-brain-api, build-web]

    steps:
      - uses: actions/checkout@v4

      - name: Login to DOCR
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DO_API_TOKEN }}
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push brain-api
        uses: docker/build-push-action@v5
        with:
          context: services/brain-api
          push: true
          cache-from: type=gha,scope=brain-api
          cache-to: type=gha,scope=brain-api,mode=max
          tags: |
            registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/brain-api:${{ github.sha }}
            registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/brain-api:latest

      - name: Build & push mcp-gateway
        uses: docker/build-push-action@v5
        with:
          context: services/mcp-gateway
          push: true
          cache-from: type=gha,scope=mcp-gateway
          cache-to: type=gha,scope=mcp-gateway,mode=max
          tags: |
            registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/mcp-gateway:${{ github.sha }}
            registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/mcp-gateway:latest

      - name: Build & push sync-bridge
        uses: docker/build-push-action@v5
        with:
          context: services/sync-bridge
          push: true
          cache-from: type=gha,scope=sync-bridge
          cache-to: type=gha,scope=sync-bridge,mode=max
          tags: |
            registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/sync-bridge:${{ github.sha }}
            registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/sync-bridge:latest

      - name: Build & push brain-web
        uses: docker/build-push-action@v5
        with:
          context: services/brain-web
          push: true
          cache-from: type=gha,scope=brain-web
          cache-to: type=gha,scope=brain-web,mode=max
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_KEYCLOAK_URL=${{ vars.VITE_KEYCLOAK_URL }}
            VITE_KEYCLOAK_REALM=${{ vars.VITE_KEYCLOAK_REALM }}
            VITE_KEYCLOAK_CLIENT_ID=${{ vars.VITE_KEYCLOAK_CLIENT_ID }}
          tags: |
            registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/brain-web:${{ github.sha }}
            registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/brain-web:latest

  # ---------------------------------------------------------------------------
  # Job 6: Deploy to DigitalOcean Droplet
  # Only runs on push to main AFTER docker-build passes.
  #
  # Passes DEPLOY_TAG (git SHA) and DOCR credentials to the Droplet via SSH.
  # deploy.sh uses these to pull the exact images built in Job 5.
  #
  # Requires these GitHub secrets (in addition to Job 5 secrets above):
  #   DO_SSH_KEY     — private key for the deploy user on the Droplet
  #   DO_DROPLET_IP  — Droplet IP address
  #   DO_DEPLOY_USER — SSH user (default: deploy)
  # ---------------------------------------------------------------------------
  deploy-digitalocean:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-build, helm-lint]
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: ${{ secrets.DO_DEPLOY_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: DEPLOY_TAG,DO_API_TOKEN,DO_REGISTRY_NAME
          script: |
            set -e
            cd /opt/bedrock-brain
            git fetch origin main
            git reset --hard origin/main
            bash infra/digitalocean/deploy.sh
          script_stop: true
        env:
          DEPLOY_TAG: ${{ github.sha }}
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          DO_REGISTRY_NAME: ${{ secrets.DO_REGISTRY_NAME }}
